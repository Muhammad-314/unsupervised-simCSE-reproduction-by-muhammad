# ============================================================
# SimCSE Resume Infrastructure Test
# ============================================================

experiment_name: resume_test_2epoch

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------

model_name: bert-base-uncased

mlp_only_train: true

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

dataset_path: data/raw/wiki1m_for_simcse.txt

max_seq_length: 32

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------

batch_size: 64

learning_rate: 3.0e-5

epochs: 2

temperature: 0.05

dropout: 0.1

max_grad_norm: 1.0

# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------

seed: 42

# ------------------------------------------------------------
# DataLoader
# ------------------------------------------------------------

shuffle: true

drop_last: true

num_workers: 0

# ------------------------------------------------------------
# Reference
# ------------------------------------------------------------

target_reference:
  official_model: princeton-nlp/unsup-simcse-bert-base-uncased
  reported_average_sts: 76.25
