# ============================================================
# SimCSE Unsupervised BERT-base Baseline
# ============================================================

experiment_name: unsupervised_bert_base

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------

model_name: bert-base-uncased

mlp_only_train: true

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

dataset_path: data/raw/wiki1m_for_simcse.txt

max_seq_length: 32

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------

batch_size: 64

learning_rate: 3.0e-5

epochs: 1

temperature: 0.05

dropout: 0.1

max_grad_norm: 1.0

# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------

seed: 42

# ------------------------------------------------------------
# DataLoader
# ------------------------------------------------------------

shuffle: true

drop_last: true

num_workers: 0
